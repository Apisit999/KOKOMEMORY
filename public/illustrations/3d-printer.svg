<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98aae"/><stop offset=".5" stop-color="#a79bd8"/><stop offset="1" stop-color="#7fb2ee"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#a79bd8" stop-opacity=".18"/><stop offset="1" stop-color="#a79bd8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="#ffffff"/>
  <circle cx="400" cy="320" r="260" fill="url(#glow)"/>
  <!-- grid floor -->
  <g stroke="#ececea" stroke-width="1">
    <line x1="120" y1="500" x2="680" y2="500"/><line x1="160" y1="530" x2="640" y2="530"/><line x1="200" y1="560" x2="600" y2="560"/>
  </g>
