  <rect x="210" y="110" width="380" height="390" rx="6" stroke="#151515" stroke-width="2.5"/>
  <line x1="210" y1="170" x2="590" y2="170" stroke="#151515" stroke-width="2"/>
  <line x1="250" y1="170" x2="250" y2="460" stroke="#151515" stroke-width="1.5"/>
  <line x1="550" y1="170" x2="550" y2="460" stroke="#151515" stroke-width="1.5"/>
  <!-- gantry + nozzle -->
  <line x1="250" y1="230" x2="550" y2="230" stroke="#151515" stroke-width="2"/>
  <rect x="368" y="210" width="64" height="44" rx="3" stroke="#151515" stroke-width="2" fill="#fff"/>
