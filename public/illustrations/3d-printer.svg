  <g stroke="url(#g)" stroke-width="3">
    <path d="M352 440 h96"/><path d="M356 428 h88"/><path d="M362 416 h76"/><path d="M370 404 h60"/>
    <path d="M376 392 h48"/><path d="M372 380 h56"/><path d="M366 368 h68"/><path d="M362 356 h76"/>
    <path d="M366 344 h68"/><path d="M374 332 h52"/><path d="M384 320 h32"/>
  </g>
  <!-- bed -->
  <rect x="290" y="448" width="220" height="14" rx="2" stroke="#151515" stroke-width="2" fill="#fafaf9"/>
  <!-- status panel -->
  <rect x="520" y="128" width="54" height="26" rx="3" stroke="#151515" stroke-width="1.5"/>
  <circle cx="536" cy="141" r="4" fill="url(#g)"/>
  <line x1="546" y1="141" x2="564" y2="141" stroke="#151515" stroke-width="1.5"/>
