<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98aae"/><stop offset=".5" stop-color="#a79bd8"/><stop offset="1" stop-color="#7fb2ee"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a79bd8" stop-opacity=".18"/><stop offset="1" stop-color="#a79bd8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="520" fill="#fafaf9"/>
  <circle cx="320" cy="260" r="230" fill="url(#glow)"/>

  <!-- Calendar -->
  <g transform="translate(150 110)">
    <rect width="300" height="270" rx="6" fill="#fff" stroke="#151515" stroke-width="2"/>
    <rect width="300" height="56" rx="6" fill="#151515"/>
    <rect y="40" width="300" height="16" fill="#151515"/>
    <line x1="70" y1="-14" x2="70" y2="18" stroke="#151515" stroke-width="3"/>
    <line x1="230" y1="-14" x2="230" y2="18" stroke="#151515" stroke-width="3"/>
    <text x="150" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" letter-spacing="3">EVENT DAY</text>
    <g fill="#e8e8e6">
      <rect x="22" y="80" width="30" height="26" rx="3"/><rect x="62" y="80" width="30" height="26" rx="3"/><rect x="102" y="80" width="30" height="26" rx="3"/><rect x="142" y="80" width="30" height="26" rx="3"/><rect x="182" y="80" width="30" height="26" rx="3"/><rect x="222" y="80" width="30" height="26" rx="3"/>
      <rect x="22" y="120" width="30" height="26" rx="3"/><rect x="62" y="120" width="30" height="26" rx="3"/><rect x="102" y="120" width="30" height="26" rx="3"/><rect x="182" y="120" width="30" height="26" rx="3"/><rect x="222" y="120" width="30" height="26" rx="3"/>
      <rect x="22" y="160" width="30" height="26" rx="3"/><rect x="62" y="160" width="30" height="26" rx="3"/><rect x="102" y="160" width="30" height="26" rx="3"/><rect x="142" y="160" width="30" height="26" rx="3"/><rect x="182" y="160" width="30" height="26" rx="3"/><rect x="222" y="160" width="30" height="26" rx="3"/>
      <rect x="22" y="200" width="30" height="26" rx="3"/><rect x="62" y="200" width="30" height="26" rx="3"/><rect x="102" y="200" width="30" height="26" rx="3"/><rect x="142" y="200" width="30" height="26" rx="3"/>
    </g>
    <!-- Selected day -->
    <rect x="140" y="116" width="34" height="34" rx="4" fill="url(#g)"/>
    <path d="M149 133l6 6 11-12" stroke="#fff" stroke-width="3"/>
  </g>

  <!-- Photo strip coming out -->
  <g transform="translate(470 230) rotate(10)">
    <rect width="92" height="236" rx="3" fill="#fff" stroke="#151515" stroke-width="1.8"/>
    <rect x="10" y="10" width="72" height="56" fill="url(#g)" opacity=".55"/>
    <rect x="10" y="74" width="72" height="56" fill="url(#g)" opacity=".4"/>
    <rect x="10" y="138" width="72" height="56" fill="url(#g)" opacity=".28"/>
    <line x1="22" y1="214" x2="70" y2="214" stroke="#151515" stroke-width="1.2"/>
  </g>

  <!-- Sparkles -->
  <path d="M110 120l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" stroke="url(#g)" stroke-width="2"/>
  <path d="M520 110l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" stroke="url(#g)" stroke-width="2"/>
  <line x1="120" y1="440" x2="420" y2="440" stroke="#e8e8e6" stroke-width="2"/>
