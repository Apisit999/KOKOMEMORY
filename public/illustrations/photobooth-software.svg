<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98aae"/><stop offset=".5" stop-color="#a79bd8"/><stop offset="1" stop-color="#7fb2ee"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a79bd8" stop-opacity=".16"/><stop offset="1" stop-color="#a79bd8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="520" fill="#fafaf9"/>
  <rect x=".5" y=".5" width="999" height="519" stroke="#e8e8e6"/>
  <circle cx="500" cy="250" r="260" fill="url(#glow)"/>
  <!-- touch screen -->
  <rect x="270" y="70" width="460" height="300" rx="8" stroke="#151515" stroke-width="2.5" fill="#fff"/>
  <rect x="290" y="90" width="420" height="260" stroke="#e8e8e6" stroke-width="1"/>
  <!-- live view frame -->
  <rect x="320" y="115" width="220" height="210" stroke="#151515" stroke-width="1.5"/>
  <circle cx="430" cy="195" r="34" stroke="url(#g)" stroke-width="2.5"/>
  <path d="M370 300 q60 -60 120 0" stroke="url(#g)" stroke-width="2.5"/>
  <path d="M320 135 h20 M320 115 v20 M540 135 h-20 M540 115 v20 M320 305 h20 M320 325 v-20 M540 305 h-20 M540 325 v-20" stroke="#151515" stroke-width="2"/>
  <!-- side controls -->
  <line x1="570" y1="130" x2="680" y2="130" stroke="#151515" stroke-width="1.5"/>
  <line x1="570" y1="152" x2="650" y2="152" stroke="#9a9a96" stroke-width="1.5"/>
  <rect x="570" y="190" width="110" height="34" rx="2" stroke="#151515" stroke-width="1.5"/>
  <rect x="570" y="236" width="110" height="34" rx="2" fill="#151515"/>
  <circle cx="625" cy="300" r="18" stroke="url(#g)" stroke-width="2.5"/>
  <!-- stand -->
  <line x1="500" y1="370" x2="500" y2="440" stroke="#151515" stroke-width="2.5"/>
  <line x1="430" y1="440" x2="570" y2="440" stroke="#151515" stroke-width="2.5"/>
  <!-- photo strip -->
  <g transform="translate(780 120) rotate(6)">
    <rect width="96" height="300" stroke="#151515" stroke-width="2" fill="#fff"/>
    <rect x="12" y="14" width="72" height="62" stroke="url(#g)" stroke-width="2"/>
    <rect x="12" y="88" width="72" height="62" stroke="url(#g)" stroke-width="2"/>
    <rect x="12" y="162" width="72" height="62" stroke="url(#g)" stroke-width="2"/>
    <text x="48" y="262" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#5c5c5c" stroke="none">KOKO</text>
  </g>
  <!-- sparkle -->
  <path d="M190 160 l6 -16 l6 16 l16 6 l-16 6 l-6 16 l-6 -16 l-16 -6 z" stroke="url(#g)" stroke-width="1.5"/>
</svg>
