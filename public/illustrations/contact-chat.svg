<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98aae"/><stop offset=".5" stop-color="#a79bd8"/><stop offset="1" stop-color="#7fb2ee"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a79bd8" stop-opacity=".18"/><stop offset="1" stop-color="#a79bd8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="520" fill="#fafaf9"/>
  <circle cx="320" cy="260" r="230" fill="url(#glow)"/>

  <!-- Phone -->
  <g transform="translate(230 70)">
    <rect width="180" height="360" rx="24" fill="#fff" stroke="#151515" stroke-width="2.2"/>
    <rect x="68" y="14" width="44" height="6" rx="3" fill="#151515"/>
    <!-- Customer bubble -->
    <rect x="18" y="52" width="118" height="44" rx="12" fill="#f3f3f1"/>
    <line x1="32" y1="68" x2="118" y2="68" stroke="#5c5c5c" stroke-width="2"/>
    <line x1="32" y1="80" x2="96" y2="80" stroke="#5c5c5c" stroke-width="2"/>
    <!-- KOKO reply -->
    <rect x="44" y="112" width="118" height="58" rx="12" fill="url(#g)"/>
    <line x1="58" y1="130" x2="146" y2="130" stroke="#fff" stroke-width="2"/>
    <line x1="58" y1="142" x2="140" y2="142" stroke="#fff" stroke-width="2"/>
    <line x1="58" y1="154" x2="112" y2="154" stroke="#fff" stroke-width="2"/>
    <!-- Customer bubble 2 -->
    <rect x="18" y="186" width="96" height="34" rx="12" fill="#f3f3f1"/>
    <line x1="32" y1="203" x2="96" y2="203" stroke="#5c5c5c" stroke-width="2"/>
    <!-- Typing -->
    <rect x="98" y="236" width="64" height="30" rx="12" fill="#ecebf7"/>
    <circle cx="116" cy="251" r="3.5" fill="#7a6cc0"/><circle cx="130" cy="251" r="3.5" fill="#7a6cc0"/><circle cx="144" cy="251" r="3.5" fill="#7a6cc0"/>
    <rect x="18" y="306" width="144" height="34" rx="17" stroke="#e8e8e6" stroke-width="2"/>
  </g>

  <!-- Floating icons: mail + phone -->
  <g transform="translate(92 150)">
    <rect width="96" height="70" rx="6" fill="#fff" stroke="#151515" stroke-width="2"/>
    <path d="M6 8l42 32 42-32" stroke="#151515" stroke-width="2"/>
  </g>
  <g transform="translate(470 290)">
    <circle cx="40" cy="40" r="40" fill="#fff" stroke="url(#g)" stroke-width="2.5"/>
    <path d="M26 24c4 14 12 24 28 32l6-7c1-1 3-1 4 0l6 5c1 1 1 3 0 4-5 6-12 7-20 3-14-7-24-18-30-32-3-8-1-14 5-18 1-1 3-1 4 0l5 7c1 1 1 3 0 4z" stroke="#151515" stroke-width="2" transform="translate(-2 -4) scale(.9)"/>
  </g>
  <path d="M500 120l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" stroke="url(#g)" stroke-width="2"/>
  <path d="M120 360l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" stroke="url(#g)" stroke-width="2"/>
</svg>
