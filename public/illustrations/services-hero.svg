<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d98aae"/><stop offset=".5" stop-color="#a79bd8"/><stop offset="1" stop-color="#7fb2ee"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a79bd8" stop-opacity=".16"/><stop offset="1" stop-color="#a79bd8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1100" height="360" fill="#fafaf9"/>
  <rect x=".5" y=".5" width="1099" height="359" stroke="#e8e8e6"/>
  <line x1="275" y1="40" x2="275" y2="320" stroke="#e8e8e6"/>
  <line x1="550" y1="40" x2="550" y2="320" stroke="#e8e8e6"/>
  <line x1="825" y1="40" x2="825" y2="320" stroke="#e8e8e6"/>

  <!-- 01 Photobooth rental: booth with ring light -->
  <g transform="translate(137 170)">
    <circle r="110" fill="url(#glow)" stroke="none"/>
    <circle cx="0" cy="-58" r="30" stroke="url(#g)" stroke-width="2"/>
    <circle cx="0" cy="-58" r="10" stroke="#151515" stroke-width="1.5"/>
    <rect x="-34" y="-20" width="68" height="74" rx="4" stroke="#151515" stroke-width="1.5"/>
    <rect x="-24" y="-10" width="48" height="34" stroke="#151515" stroke-width="1.2"/>
    <line x1="0" y1="54" x2="0" y2="92" stroke="#151515" stroke-width="1.5"/>
    <line x1="-28" y1="92" x2="28" y2="92" stroke="#151515" stroke-width="1.5"/>
  </g>
  <text x="137" y="320" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#5c5c5c">01 · Photobooth</text>

  <!-- 02 Photobooth software: touch screen with photo strip -->
  <g transform="translate(412 160)">
    <circle r="110" fill="url(#glow)" stroke="none"/>
    <rect x="-70" y="-60" width="140" height="96" rx="4" stroke="#151515" stroke-width="1.5"/>
    <rect x="-54" y="-46" width="44" height="68" stroke="url(#g)" stroke-width="2"/>
    <line x1="-54" y1="-23" x2="-10" y2="-23" stroke="url(#g)" stroke-width="1.2"/>
    <line x1="-54" y1="0" x2="-10" y2="0" stroke="url(#g)" stroke-width="1.2"/>
    <line x1="6" y1="-34" x2="54" y2="-34" stroke="#151515" stroke-width="1.2"/>
    <line x1="6" y1="-18" x2="42" y2="-18" stroke="#9a9a96" stroke-width="1.2"/>
    <rect x="6" y="2" width="36" height="14" rx="2" stroke="#151515" stroke-width="1.2"/>
    <line x1="0" y1="36" x2="0" y2="70" stroke="#151515" stroke-width="1.5"/>
    <line x1="-30" y1="70" x2="30" y2="70" stroke="#151515" stroke-width="1.5"/>
  </g>
  <text x="412" y="320" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#5c5c5c">02 · Software</text>

  <!-- 03 3D print: printer frame with layered object -->
  <g transform="translate(687 165)">
    <circle r="110" fill="url(#glow)" stroke="none"/>
    <rect x="-64" y="-70" width="128" height="132" rx="4" stroke="#151515" stroke-width="1.5"/>
    <line x1="-64" y1="-44" x2="64" y2="-44" stroke="#151515" stroke-width="1.2"/>
    <rect x="-12" y="-52" width="24" height="16" stroke="#151515" stroke-width="1.2"/>
    <path d="M0 -36 L0 -24" stroke="url(#g)" stroke-width="2"/>
    <path d="M-30 40 h60 M-24 30 h48 M-18 20 h36 M-12 10 h24" stroke="url(#g)" stroke-width="2"/>
    <line x1="-48" y1="48" x2="48" y2="48" stroke="#151515" stroke-width="1.5"/>
  </g>
  <text x="687" y="320" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#5c5c5c">03 · 3D Print</text>

  <!-- 04 Business software: code window -->
  <g transform="translate(962 165)">
    <circle r="110" fill="url(#glow)" stroke="none"/>
    <rect x="-70" y="-56" width="140" height="104" rx="4" stroke="#151515" stroke-width="1.5"/>
    <line x1="-70" y1="-36" x2="70" y2="-36" stroke="#151515" stroke-width="1.2"/>
    <circle cx="-56" cy="-46" r="3" stroke="#151515" stroke-width="1.2"/>
    <circle cx="-44" cy="-46" r="3" stroke="#151515" stroke-width="1.2"/>
    <path d="M-28 -6 L-44 8 L-28 22" stroke="url(#g)" stroke-width="2"/>
    <path d="M28 -6 L44 8 L28 22" stroke="url(#g)" stroke-width="2"/>
    <path d="M10 -12 L-10 28" stroke="#151515" stroke-width="1.5"/>
  </g>
  <text x="962" y="320" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#5c5c5c">04 · Business</text>
</svg>
